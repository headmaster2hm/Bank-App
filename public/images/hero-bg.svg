<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0%" stop-color="#3a6b96"/>
            <stop offset="45%" stop-color="#2b5378"/>
            <stop offset="100%" stop-color="#1c3a57"/>
        </linearGradient>

        <linearGradient id="arcGold" x1="0" y1="1" x2="0.8" y2="0">
            <stop offset="0%" stop-color="#e9be72" stop-opacity="0.35"/>
            <stop offset="50%" stop-color="#dfa445" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#f9edd4" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="archLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#bcccdc" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#bcccdc" stop-opacity="0.04"/>
        </linearGradient>

        <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#f2d8a8" stop-opacity="0.55"/>
            <stop offset="55%" stop-color="#d18e2a" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#d18e2a" stop-opacity="0"/>
        </radialGradient>

        <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0H0V64" fill="none" stroke="#d9e2ec" stroke-opacity="0.10" stroke-width="1"/>
        </pattern>

        <clipPath id="dome">
            <path d="M620 900 L620 470 A 380 380 0 0 1 1380 470 L1380 900 Z"/>
        </clipPath>
    </defs>

    <rect width="1600" height="900" fill="url(#sky)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>

    <circle cx="1180" cy="330" r="420" fill="url(#sunGlow)"/>

    <g clip-path="url(#dome)">
        <rect x="620" y="90" width="760" height="810" fill="url(#archLight)"/>

        <g stroke="#d9e2ec" stroke-opacity="0.16" stroke-width="2" fill="none">
            <path d="M700 900 L700 470 A 300 300 0 0 1 1300 470 L1300 900"/>
            <path d="M780 900 L780 470 A 220 220 0 0 1 1220 470 L1220 900"/>
            <path d="M860 900 L860 470 A 140 140 0 0 1 1140 470 L1140 900"/>
        </g>

        <g fill="#d9e2ec" fill-opacity="0.13">
            <rect x="700" y="520" width="70" height="380"/>
            <rect x="810" y="520" width="70" height="380"/>
            <rect x="920" y="520" width="70" height="380"/>
            <rect x="1030" y="520" width="70" height="380"/>
            <rect x="1140" y="520" width="70" height="380"/>
            <rect x="1250" y="520" width="50" height="380"/>
        </g>
    </g>

    <g fill="none" stroke="url(#arcGold)" stroke-width="3.5">
        <path d="M620 900 L620 470 A 380 380 0 0 1 1380 470 L1380 900"/>
        <path d="M540 900 L540 470 A 460 460 0 0 1 1460 470 L1460 900" stroke-opacity="0.5"/>
        <path d="M700 900 L700 470 A 300 300 0 0 1 1300 470 L1300 900" stroke-opacity="0.45"/>
    </g>

    <g stroke="#f9edd4" stroke-opacity="0.13" stroke-width="1.5" fill="none">
        <path d="M0 250 L1600 700"/>
        <path d="M0 170 L1600 620"/>
        <path d="M0 90 L1600 540"/>
    </g>

    <g fill="#f9edd4" fill-opacity="0.45">
        <circle cx="300" cy="180" r="3"/>
        <circle cx="470" cy="120" r="2"/>
        <circle cx="760" cy="200" r="2.5"/>
        <circle cx="1520" cy="210" r="2.5"/>
        <circle cx="220" cy="620" r="2"/>
        <circle cx="1450" cy="700" r="3"/>
    </g>
</svg>
